[build-system]
requires = ["uv_build>=0.9.0,<0.14.0"]
build-backend = "uv_build"

[project]
name = "way2australia-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23.0",
  "pydantic>=2.10.0",
  "pyyaml>=6.0",
  "way2australia-core",
]

[project.optional-dependencies]
# Real BGE-M3 embeddings; brings PyTorch. Install with `make setup-bge-m3`.
bge-m3 = [
  "sentence-transformers>=3.0.0",
]

[tool.uv]
package = true

[tool.uv.sources]
way2australia-core = { workspace = true }
