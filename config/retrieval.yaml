# Retrieval strategy and fusion (Spec 007). Reviewed like other config.
schema_version: "1.3"
default_strategy: hybrid         # dense | bm25 | hybrid
lexical:
  tokenizer: lexical-v2          # lexical-v1 | lexical-v2 (Spec 010 T5 promoted v2)
fusion:
  method: rrf
  k: 60
  weights: {dense: 1.0, bm25: 1.0}
  candidate_depth: 50            # 1..50 (MAX_TOP_K)
qdrant:
  connect_timeout_s: 2           # integer 1..30; bounds every open/binding request
  query_timeout_s: 3             # integer 1..30; bounds each search request
rerank:
  enabled: false                 # Spec 011: only T5 may change enabled/depth
  provider: bge                  # bge | fake
  model_id: BAAI/bge-reranker-v2-m3
  revision: 953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e   # hub commit SHA read 2026-11-05
  depth: 20                      # 1..fusion.candidate_depth
  max_length: 512                # 32..8192
  batch_size: 16                 # 1..256
