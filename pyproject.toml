[build-system]
requires = ["uv_build>=0.9.0,<0.14.0"]
build-backend = "uv_build"

[project]
name = "way2australia"
version = "0.1.0"
description = "Way2Australia — AI-powered NAATI CCL preparation platform"
requires-python = ">=3.12"

dependencies = [
  "fastapi[standard]>=0.115.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "ruff>=0.8.0",
  "pyright>=1.1.390",
]

# ---------------------------------------------------------------------------
# uv — workspace configuration
# The root is a virtual/workspace-only project, not an installable package.
# ---------------------------------------------------------------------------
[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "apps/api",
  "packages/core",
  "packages/rag",
  "packages/observability",
]

# ---------------------------------------------------------------------------
# Ruff — formatting and linting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
  ".uv-cache",
  ".uv-python",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Pyright — static type checking
# venvPath/venv tell Pyright where to find the workspace packages.
# ---------------------------------------------------------------------------
[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
include = [
  "apps",
  "packages",
  "tests",
  "scripts",
]
exclude = [
  "**/__pycache__",
  ".uv-cache",
  ".uv-python",
  ".venv",
]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = ["--strict-markers"]
testpaths = ["apps", "packages", "tests"]
markers = [
  "integration: tests that require external services or slower local dependencies",
]
